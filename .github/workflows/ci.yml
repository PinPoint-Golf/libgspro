name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # ⚠ THE CONFORMANCE SUITE IS THE GATE.  It ran behind a `-L ready` filter
  # while the library was being written, because the suite came first (design
  # §11 package 1b) and a job that is always red teaches everyone to ignore it.
  # Every source group has landed, so all 103 socket-free cases run on every
  # platform and a red build is a real regression — and since package 5 so do the
  # host-transport cases against the C reference transport (tests/test_net.c) and
  # the gsplisten smoke test, which are the only jobs here that open a socket.
  # ⚠ They bind 127.0.0.1 on an EPHEMERAL port: a runner with 921 held, or with
  # no route to the LAN, must not be a red build.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux-gcc",   os: ubuntu-latest,  cc: gcc,   extra: "" }
          - { name: "linux-clang", os: ubuntu-latest,  cc: clang, extra: "" }
          - { name: "linux-san",   os: ubuntu-latest,  cc: gcc,
              extra: "-DGS_ENABLE_ASAN=ON -DGS_ENABLE_UBSAN=ON" }
          - { name: "macos",       os: macos-latest,   cc: clang, extra: "" }
          - { name: "windows",     os: windows-latest, cc: "",    extra: "" }
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.extra }}
        env:
          CC: ${{ matrix.cc }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  # ---------------------------------------------------------------------------
  # ⚠ THE INSTALL RULES ARE EXECUTED, because the last time they were not they
  # were broken for the whole life of the project: install(FILES) named a header
  # that does not exist and EXPORT gsproTargets was declared but never installed,
  # so `cmake --install` failed and find_package(gspro) found nothing.  Neither
  # showed up until someone ran them.  This job runs them and then CONSUMES the
  # result — a separate project that find_package(gspro CONFIG)s the install
  # tree and links gspro::gspro — which is exactly what PinPoint Studio will do
  # (design §11 package 8).
  # ---------------------------------------------------------------------------
  install:
    name: install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_INSTALL_PREFIX=$PWD/_inst \
                -DGS_BUILD_TESTS=OFF -DGS_BUILD_TOOLS=OFF -DGS_BUILD_FFI=OFF
          cmake --build build --parallel
      - name: Install
        run: cmake --install build
      - name: Consume via find_package(gspro CONFIG)
        run: |
          mkdir -p _consumer
          cat > _consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(consumer C)
          find_package(gspro CONFIG REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE gspro::gspro)
          # ⚠ The reference transport is a SECOND target and a second link line,
          # exported by the same package.  It was installed by the build above
          # (GS_BUILD_NET defaults ON when top-level), so an export set that
          # forgot it, or a header the install rules missed, fails right here.
          add_executable(consumer_net main_net.c)
          target_link_libraries(consumer_net PRIVATE gspro::gspro_net gspro::gspro)
          CMAKE
          cat > _consumer/main_net.c <<'MAIN'
          #include "gspro/gspro.h"
          #include "gspro/net.h"
          #include <stdio.h>
          int main(void) {
              gsp_server_config sc = gsp_server_config_default();
              gsp_net_config nc = gsp_net_config_default();
              gsp_server *s = NULL; gsp_net *n = NULL;
              char why[GSP_NET_ERROR_MAX];
              if (gsp_server_create(&sc, &s) != GSP_OK) return 1;
              nc.host = "127.0.0.1"; nc.ephemeral_port = true;
              if (gsp_net_open(s, &nc, &n, why, sizeof(why)) != GSP_OK) {
                  printf("gsp_net_open: %s\n", why); return 1;
              }
              printf("listening on 127.0.0.1:%u\n", gsp_net_port(n));
              gsp_net_close(n); gsp_server_close(s); gsp_server_destroy(s);
              return 0;
          }
          MAIN
          cat > _consumer/main.c <<'MAIN'
          #include "gspro/gspro.h"
          #include <stdio.h>
          #include <string.h>
          int main(void) {
              const char *s = "{\"DeviceID\":\"x\",\"ShotDataOptions\":"
                              "{\"ContainsBallData\":false,\"ContainsClubData\":false}}";
              gsp_message m;
              if (gsp_message_decode((const uint8_t *)s, strlen(s), &m) != GSP_OK) return 1;
              printf("consumed gspro %s, kind=%d\n", gsp_version_string(), m.kind);
              return 0;
          }
          MAIN
          cmake -S _consumer -B _consumer/build -DCMAKE_PREFIX_PATH=$PWD/_inst
          cmake --build _consumer/build
          ./_consumer/build/consumer
          ./_consumer/build/consumer_net
      - name: Consume via pkg-config
        run: |
          export PKG_CONFIG_PATH=$PWD/_inst/lib/pkgconfig
          test "$(pkg-config --modversion gspro)" = "0.1.0"
          cc _consumer/main.c $(pkg-config --cflags --libs gspro) -o _pc_consumer
          ./_pc_consumer
          # ⚠ The transport is its OWN module, so that `--libs gspro` never hands
          # a socket loop to a host that has one of its own.
          test "$(pkg-config --modversion gspro-net)" = "0.1.0"
          cc _consumer/main_net.c $(pkg-config --cflags --libs gspro-net) -o _pc_net
          ./_pc_net

  # ---------------------------------------------------------------------------
  # How much of the specification the library satisfies, as a number in the run
  # summary.  Never blocks — `build` above is the gate — but a case count that
  # quietly falls is visible here even when every binary still exits 0, which is
  # what a retired case looks like.
  # ---------------------------------------------------------------------------
  progress:
    name: conformance progress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      # ⚠ `shell: bash` rather than the default `bash -e`, and an explicit exit 0.
      # A progress report must not be able to fail: `grep -c` exits 1 on zero
      # matches, which under -e aborted this step and turned the whole run red
      # for a job whose only purpose is to print a number.
      - name: Count green cases
        shell: bash
        run: |
          set +e
          total=0; green=0
          for t in build/tests/test_*; do
            [ -x "$t" ] || continue
            out=$("$t" 2>/dev/null)
            n=$(printf '%s\n' "$out" | grep -c '^\[')
            g=$(printf '%s\n' "$out" | grep -c '^\[ ok \]')
            total=$((total + n)); green=$((green + g))
          done
          echo "conformance: $green / $total cases green"
          {
            echo "## Conformance: $green / $total cases green"
            if [ "$total" -gt 0 ] && [ "$green" -lt "$total" ]; then
              echo
              echo "⚠ $((total - green)) case(s) failing — see the \`build\` job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
